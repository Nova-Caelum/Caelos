name: DevOps-Lead PR Review

# THIN CALLER STUB — Option B source-of-truth/runtime split (2026-07-18).
# All review logic lives in Nova-Caelum/devops-lead
# .github/workflows/devops-lead-pr-review.yml (source of truth). This stub is
# the only workflow content in THIS repo; the `uses:` pin below is the review
# gate for logic changes.
#
# PIN: full-SHA pin is the review gate for logic changes. To update logic:
# PR + review in devops-lead repo, then bump this pin (one-line PR — loudly
# escalated by design since it touches .github/workflows/). Never re-point
# to @main.
#
# PUBLIC-REPO CONSTRAINT (2026-07-28): Caelos is public. The job-level `if:`
# gate below restricts review runs to trusted associations (OWNER / MEMBER /
# COLLABORATOR) — external PRs from forks or unknown contributors do NOT
# trigger the DevOps-Lead review, per the Config Split policy documented at
# `_wiki/novacaelum_tech/07_repositories/00_INDEX.md` §"DevOps-Lead PR-review
# workflow". External PRs stay open for human close-of-loop. Secondary safety:
# GitHub does not pass `secrets: inherit` to fork PRs on public repos, so
# even if the gate were bypassed, the Claude action would fail auth.
#
# Rollback: git revert this commit -> restores the pre-workflow state.

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  devops-lead-review:
    # Trusted-committer gate (public-repo hygiene). Same-repo PRs run review;
    # fork PRs skip (they wouldn't get secrets anyway, but explicit skip = clean
    # green-check on the PR UI instead of a failed auth attempt).
    #
    # Note (2026-07-28): initially used `github.event.pull_request.author_association`
    # here, but that context field silently evaluated to nothing on Caelos
    # (workflow runs 30400886495, 30401203496, 30401437662 all skipped despite
    # API-verified MEMBER association). `github.actor` and same-repo check both
    # evaluated correctly; using the safer structural check.
    if: ${{ github.event.pull_request.head.repo.owner.login == github.repository_owner }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    uses: Nova-Caelum/devops-lead/.github/workflows/devops-lead-pr-review.yml@0d1b16cee071fcd8896c7dc5130a2644f0360a30
    # PIN NOTE: bumped 2026-07-31 from 4729b2b2 (single-tenant, ops-mirror-shaped
    # hardcoded policy) to 0d1b16ce (multi-tenant parameterization — inputs added
    # to workflow_call, defaults preserve ops-mirror behavior). Caelos passes
    # repo-shaped policy below.
    secrets: inherit
    with:
      # Fetch canonical DevOps-Lead persona from the reusable-workflow repo
      # itself (public since 2026-07-30). Caelos does not carry the ops-mirror
      # `_agentOS/agent_profiles/...` layout, so the default caller-tree persona
      # path would 404. Pointing at devops-lead@main keeps a single source of
      # truth for the persona across all callers.
      persona_source_repo: 'Nova-Caelum/devops-lead'
      persona_source_ref: 'main'
      persona_path: '.persona-source/.claude/agents/devops-lead.md'

      # AUTO-MERGE-SAFE for Caelos (Vite/React design-system console):
      #   - all markdown (docs, handoff notes, design-QA writeups)
      #   - project meta (README, LICENSE, ATTRIBUTIONS)
      #   - Foundry-authored design-token seed promotions — these ARE the point
      #     of the Foundry Commit-and-Push flow; Daniel curates via Foundry UI
      #     BEFORE the PR opens, so post-hoc review adds no signal
      auto_merge_paths: |
        **/*.md, README.md, LICENSE, ATTRIBUTIONS.md, src/design/seed.ts, src/design/seed.override.json, src/design/shapeSeed.ts, .gitignore

      # ESCALATE-ALWAYS for Caelos:
      #   - workflow files (self-review deadlock — handled by the reusable
      #     workflow's validation-skip layer too, but belt-and-suspenders here)
      #   - dependency manifests (supply-chain surface)
      #   - build/dev config (Vite plugins can pwn the dev server)
      # Everything else (application source `src/app/**`, `src/primitives/**`,
      # `src/styles/**`, `src/main.tsx`, etc.) falls through to the reviewer's
      # "any diff you cannot confidently classify" backstop → escalate.
      escalate_paths: |
        .github/workflows/**, package.json, package-lock.json, pnpm-lock.yaml, pnpm-workspace.yaml, vite.config.ts, vite-plugins/**, postcss.config.mjs, tsconfig*.json, tailwind.config.*

      worklog_project: 'caelos-console'
      repo_context_description: 'the Caelos design-system console — a public Vite/React/TypeScript frontend whose canonical design tokens promote through the in-app Foundry flow (not through raw source edits)'
